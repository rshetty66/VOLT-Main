# Render blueprint for the VOLT Console. In Render: New > Blueprint > pick this repository.
# Then open the service > Environment and enter ANTHROPIC_API_KEY. VOLT_ACCESS_TOKEN is generated for you:
# read it there, then open https://<service>.onrender.com and type it into the Sign in screen (once per browser).
# Render has no 300-second function limit; a run still stops cleanly after 15 minutes (VOLT_RUN_BUDGET_SECONDS,
# 0 turns the limit off).
services:
  - type: web
    name: volt-console
    runtime: docker
    dockerfilePath: ./apps/volt-console/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/healthz
    disk:
      name: volt-data
      mountPath: /app/apps/volt-console/data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOLT_ACCESS_TOKEN
        generateValue: true
      - key: VOLT_MODE
        value: live
      - key: VOLT_FALLBACKS
        value: "off"
      - key: BUILDER_EXECUTION_ENABLED
        value: "false"
      - key: VOLT_HOST
        value: 0.0.0.0
      - key: VOLT_TRUST_PROXY
        value: "1"
      # VOLT Ledger tools appear in the chat only when both of these resolve to the private service below.
      - key: VOLT_LEDGER_HOSTPORT
        fromService:
          type: pserv
          name: volt-ledger
          property: hostport
      - key: VOLT_LEDGER_TOKEN
        fromService:
          type: pserv
          name: volt-ledger
          envVarKey: VOLT_LEDGER_TOKEN

  # VOLT Ledger: the accounting brain (apps/volt-ledger). A private service: no public URL, reached only by the
  # console over Render's private network with a shared token. Its SQLite ledger is append-only and lives on the disk.
  - type: pserv
    name: volt-ledger
    runtime: docker
    dockerfilePath: ./apps/volt-ledger/Dockerfile
    dockerContext: .
    plan: starter
    disk:
      name: volt-ledger-data
      mountPath: /var/volt-ledger
      sizeGB: 1
    envVars:
      - key: VOLT_LEDGER_TOKEN
        generateValue: true
      - key: PORT
        value: "8790"

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<style>
:root{--bg:#0b0f17;--panel:#131a26;--line:#2a3550;--tx:#e8ecf5;--mu:#9aa6c0;--core:#19c3b1;--data:#e0b44c;--infra:#8b7cf6;--human:#ff8a4c;--err:#ff6b6b;--ok:#4ade80}
html[data-theme=light]{--bg:#f6f7fb;--panel:#fff;--line:#c9d1e3;--tx:#141b2d;--mu:#5a6785}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0 auto 0 0}select,button{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button.on{border-color:var(--core);color:var(--core)}main{display:grid;grid-template-columns:1fr 280px;gap:0;height:calc(100dvh - 53px)}
@media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:60% 40%}}
#stage{overflow:auto;padding:8px}#side{border-left:1px solid var(--line);padding:12px;overflow:auto;background:var(--panel)}
svg{width:100%;height:auto;min-width:640px}.node rect{fill:var(--panel);stroke-width:1.2}.node text{fill:var(--tx);font-size:12px}.node .sub{fill:var(--mu);font-size:10px}.node .ty{font-size:9px;letter-spacing:.06em;text-transform:uppercase}
.node{cursor:pointer;transition:opacity .2s}.dim .node,.dim .edge{opacity:.25}.dim .node.hot,.dim .edge.hot{opacity:1}.node.hot rect{stroke-width:2.4}
.edge path{fill:none;stroke:var(--mu);stroke-width:1.3}.edge text{fill:var(--mu);font-size:10px;paint-order:stroke;stroke:var(--bg);stroke-width:3px}.edge.hot path{stroke:var(--core);stroke-width:2.4}
.k-response path{stroke-dasharray:6 4}.k-async path{stroke-dasharray:2 4}.k-error path{stroke:var(--err);stroke-dasharray:6 3}.k-event path{stroke-dasharray:10 3 2 3}.k-streaming path{stroke-dasharray:4 3}
@media(prefers-reduced-motion:no-preference){.k-streaming.hot path{animation:fl .6s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}}
.grp{fill:none;stroke:var(--line);stroke-dasharray:3 4}.grp-l{fill:var(--mu);font-size:10px}
#log li{margin:0 0 8px;color:var(--mu);list-style:none;border-left:2px solid var(--line);padding-left:8px}#log li.cur{color:var(--tx);border-color:var(--core)}#log{padding:0;margin:0}
pre{white-space:pre-wrap;background:var(--bg);padding:6px;border-radius:6px;font-size:11px;color:var(--mu)}h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:12px 0 6px}
.lg{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:var(--mu)}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
</style></head><body>
<header><h1>__TITLE__</h1><select id="sc" aria-label="Scenario"></select>
<button id="prev" aria-label="Previous step">Back</button><button id="play">Play</button><button id="next" aria-label="Next step">Next</button>
<select id="sp" aria-label="Speed"><option value="1.5">Slow</option><option value="1" selected>Normal</option><option value="0.5">Fast</option></select>
<button id="th">Theme</button><button id="ex">Export</button></header>
<main><div id="stage"><svg id="svg" role="img"></svg></div>
<aside id="side"><div class="lg" id="lg"></div><h2>Scenario</h2><ol id="log"></ol><h2>Details</h2><div id="det">Click a node.</div></aside></main>
<script>
const SPEC=__SPEC__;
const COL={core:'var(--core)',data:'var(--data)',infra:'var(--infra)',human:'var(--human)'};
const CAT={agent:'core',tool:'core',model:'core',prompt:'core',skill:'core',output:'core',user:'human',human:'human',memory:'data',knowledge:'data',environment:'data',aggregator:'data',gateway:'infra',router:'infra',channel:'infra',trigger:'infra',guardrail:'infra',observability:'infra'};
const W=164,H=54,GX=96,GY=28,PAD=40;const NS='http://www.w3.org/2000/svg';
const N=Object.fromEntries(SPEC.nodes.map(n=>[n.id,n]));const E=SPEC.edges.map((e,i)=>({...e,i,k:e.kind||'request'}));
// layering: longest path, back edges (found by DFS) ignored
const adj={};SPEC.nodes.forEach(n=>adj[n.id]=[]);E.forEach(e=>adj[e.from].push(e));
const state={},back=new Set();function dfs(u){state[u]=1;for(const e of adj[u]){if(state[e.to]===1)back.add(e.i);else if(!state[e.to])dfs(e.to)}state[u]=2}
SPEC.nodes.forEach(n=>{if(!state[n.id])dfs(n.id)});
const L={};SPEC.nodes.forEach(n=>L[n.id]=n.col??0);
for(let it=0;it<SPEC.nodes.length;it++)E.forEach(e=>{if(!back.has(e.i)&&N[e.to].col==null)L[e.to]=Math.max(L[e.to],L[e.from]+1)});
const cols={};SPEC.nodes.forEach(n=>(cols[L[n.id]]??=[]).push(n));
const nc=Math.max(...Object.keys(cols).map(Number))+1,maxR=Math.max(...Object.values(cols).map(c=>c.length));
const VW=PAD*2+nc*W+(nc-1)*GX,VH=PAD*2+maxR*H+(maxR-1)*GY+60;
SPEC.nodes.forEach(n=>{const c=cols[L[n.id]];const i=n.row??c.indexOf(n);const h=c.length*H+(c.length-1)*GY;n.x=PAD+L[n.id]*(W+GX);n.y=PAD+(maxR*H+(maxR-1)*GY-h)/2+i*(H+GY)});
const svg=document.getElementById('svg');svg.setAttribute('viewBox',`0 0 ${VW} ${VH}`);
svg.innerHTML=`<title>${SPEC.title}</title><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><g id="gg"></g><g id="ge"></g><g id="gn"></g><g id="gp"></g>`;
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
(SPEC.groups||[]).forEach(g=>{const m=g.nodes.map(i=>N[i]);const x=Math.min(...m.map(n=>n.x))-14,y=Math.min(...m.map(n=>n.y))-24,x2=Math.max(...m.map(n=>n.x+W))+14,y2=Math.max(...m.map(n=>n.y+H))+14;
 el('rect',{class:'grp',x,y,width:x2-x,height:y2-y,rx:10},gg);const t=el('text',{class:'grp-l',x:x+8,y:y+14},gg);t.textContent=g.label});
const eps={};E.forEach(e=>{const a=N[e.from],b=N[e.to];const bk=back.has(e.i)||L[e.to]<=L[e.from];let d,mx,my;
 if(bk){const x1=a.x+W/2,y1=a.y+H,x2=b.x+W/2,y2=b.y+H,dy=Math.max(a.y,b.y)+H+34+(e.i%3)*8;d=`M${x1} ${y1}C${x1} ${dy},${x2} ${dy},${x2} ${y2+2}`;mx=(x1+x2)/2;my=dy-6}
 else{const x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2,c=(x2-x1)/2;d=`M${x1} ${y1}C${x1+c} ${y1},${x2-c} ${y2},${x2-2} ${y2}`;mx=(x1+x2)/2;my=(y1+y2)/2-5}
 const g=el('g',{class:'edge k-'+e.k},ge);const p=el('path',{d,'marker-end':'url(#ar)'},g);if(e.label){const t=el('text',{x:mx,y:my,'text-anchor':'middle'},g);t.textContent=e.label}
 e.g=g;e.p=p;eps[e.from+'>'+e.to]=e});
const T=n=>n.type||'agent';
SPEC.nodes.forEach(n=>{const c=COL[CAT[T(n)]||'core'];const g=el('g',{class:'node',tabindex:0,role:'button','aria-label':n.label},gn);
 el('rect',{x:n.x,y:n.y,width:W,height:H,rx:8,stroke:c},g);const a=el('text',{class:'ty',x:n.x+10,y:n.y+16,fill:c},g);a.textContent=T(n);a.style.fill=c;
 const b=el('text',{x:n.x+10,y:n.y+33},g);b.textContent=n.label;if(n.sub){const s=el('text',{class:'sub',x:n.x+10,y:n.y+47},g);s.textContent=n.sub}
 n.g=g;const sel=()=>{det.innerHTML=`<b>${n.label}</b> <span class="sub">(${T(n)})</span><p>${n.detail||n.sub||''}</p>`};g.onclick=sel;g.onkeydown=e=>{if(e.key==='Enter')sel()}});
const lg=document.getElementById('lg');[['core','Agent, tool, model'],['data','Memory, knowledge'],['infra','Router, guardrail, gateway'],['human','People']].forEach(([k,t])=>lg.insertAdjacentHTML('beforeend',`<span><i style="background:${COL[k]}"></i>${t}</span>`));
// scenarios
const SC=SPEC.scenarios||[];const sc=document.getElementById('sc');SC.forEach((s,i)=>sc.add(new Option(s.name,i)));
let cur=0,step=-1,timer=null;const log=document.getElementById('log'),det=document.getElementById('det');
const stepEdges=s=>(s.edges||[s.edge]).map(x=>eps[x]).filter(Boolean);
function render(){log.innerHTML='';(SC[cur]?.steps||[]).forEach((s,i)=>log.insertAdjacentHTML('beforeend',`<li class="${i===step?'cur':''}" data-i="${i}">${i+1}. ${s.note||s.edge||''}${s.payload&&i===step?`<pre>${typeof s.payload==='string'?s.payload:JSON.stringify(s.payload,null,1)}</pre>`:''}</li>`));
 svg.classList.toggle('dim',step>=0);document.querySelectorAll('.hot').forEach(x=>x.classList.remove('hot'));const s=SC[cur]?.steps[step];if(!s)return;
 stepEdges(s).forEach(e=>{e.g.classList.add('hot');N[e.from].g.classList.add('hot');N[e.to].g.classList.add('hot');packet(e)})}
function packet(e){const gp=document.getElementById('gp');const c=el('circle',{r:5,fill:e.k==='error'?'var(--err)':'var(--core)'},gp);const len=e.p.getTotalLength(),dur=900*+sp.value,t0=performance.now();
 (function f(t){const u=Math.min(1,(t-t0)/dur),pt=e.p.getPointAtLength(u*len);c.setAttribute('cx',pt.x);c.setAttribute('cy',pt.y);u<1?requestAnimationFrame(f):setTimeout(()=>c.remove(),150)})(t0)}
const go=i=>{const n=SC[cur]?.steps.length||0;step=Math.max(-1,Math.min(n-1,i));render()};
function stop(){clearInterval(timer);timer=null;play.textContent='Play';play.classList.remove('on')}
play.onclick=()=>{if(timer)return stop();if(step>=(SC[cur]?.steps.length||0)-1)step=-1;play.textContent='Pause';play.classList.add('on');go(step+1);timer=setInterval(()=>{if(step>=SC[cur].steps.length-1)return stop();go(step+1)},1500*+sp.value)};
next.onclick=()=>{stop();go(step+1)};prev.onclick=()=>{stop();go(step-1)};sc.onchange=()=>{stop();cur=+sc.value;step=-1;render()};
log.onclick=e=>{const li=e.target.closest('li');if(li){stop();go(+li.dataset.i)}};
th.onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme==='light'?'dark':'light'};
ex.onclick=()=>{const m=prompt('Export: png, svg or json','png');if(!m)return;const dl=(u,n)=>{const a=document.createElement('a');a.href=u;a.download=n;a.click()};
 const slug=(SPEC.title||'diagram').toLowerCase().replace(/\W+/g,'-');if(m==='json')return dl('data:application/json,'+encodeURIComponent(JSON.stringify(SPEC,(k,v)=>['g','p'].includes(k)?undefined:v,2)),slug+'.json');
 const cs=getComputedStyle(document.documentElement);let x=new XMLSerializer().serializeToString(svg).replace('<svg','<svg xmlns="'+NS+'" style="background:'+cs.getPropertyValue('--bg')+'"');
 ['--bg','--panel','--line','--tx','--mu','--core','--data','--infra','--human','--err'].forEach(v=>x=x.split('var('+v+')').join(cs.getPropertyValue(v).trim()));
 x=x.replace('<defs>','<style>text{font-family:system-ui,sans-serif}.node text{font-size:12px}.sub{font-size:10px}.ty{font-size:9px;text-transform:uppercase}.edge path{fill:none;stroke-width:1.3}.k-response path{stroke-dasharray:6 4}.k-async path{stroke-dasharray:2 4}.k-error path{stroke-dasharray:6 3}.grp{fill:none;stroke-dasharray:3 4}</style><defs>');
 if(m==='svg')return dl('data:image/svg+xml,'+encodeURIComponent(x),slug+'.svg');const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=VW*2;c.height=VH*2;c.getContext('2d').drawImage(im,0,0,c.width,c.height);dl(c.toDataURL('image/png'),slug+'.png')};im.src='data:image/svg+xml,'+encodeURIComponent(x)};
render();
</script></body></html>

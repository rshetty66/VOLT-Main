[project]
name = "volt-ledger"
version = "0.1.0"
description = "VOLT Ledger Brain: deterministic accounting engine (ontology, proposal ledger, evidence) for the VOLT Console"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["volt_ledger"]

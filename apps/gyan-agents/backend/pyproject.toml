[project]
name = "volt-gyan-agents"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "jsonschema>=4.23,<5",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.32,<1",
    "openpyxl>=3.1,<4",
    "pypdf>=6,<8",
    "mcp>=1.20,<2",
    "defusedxml>=0.7,<1",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

name: VOLT

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate VOLT plugin and console
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install harness dependencies
        run: npm ci --ignore-scripts

      - name: ECC validators (agents, commands, skills, hooks, catalog)
        run: npm run test:validators

      - name: VOLT plugin
        run: npm run volt:validate

      - name: VOLT console
        working-directory: apps/volt-console
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test

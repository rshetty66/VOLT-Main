name: VOLT console image

on:
  push:
    branches: [main]
    paths:
      - apps/volt-console/**
      - docs/volt/VOLT_PLATFORM_BLUEPRINT.md
      - .github/workflows/volt-console-ghcr.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image tags
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          owner_lc="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner_lc}/volt-console"
          echo "IMAGE_NAME=${image}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG_SHA=${SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG_LATEST=latest" >> "$GITHUB_ENV"

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin

      - name: Build image
        run: docker build -f apps/volt-console/Dockerfile -t "${IMAGE_NAME}:${IMAGE_TAG_SHA}" -t "${IMAGE_NAME}:${IMAGE_TAG_LATEST}" .

      - name: Push image
        run: |
          docker push "${IMAGE_NAME}:${IMAGE_TAG_SHA}"
          docker push "${IMAGE_NAME}:${IMAGE_TAG_LATEST}"
